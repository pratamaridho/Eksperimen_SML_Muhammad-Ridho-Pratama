name: Data Preprocessing Pipeline

# Trigger: Jalan saat ada push ke main, atau dijalankan manual
on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'          # Jalan jika ada perubahan file Python
      - '**.csv'         # Jalan jika ada data baru
  workflow_dispatch:      # Tombol manual run di tab Actions

jobs:
  build-and-process:
    runs-on: ubuntu-latest
    
    # Izin untuk melakukan commit balik ke repo
    permissions:
      contents: write

    steps:
    # 1. Checkout kode dari repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Setup Python environment
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. Install dependencies (Pandas, Scikit-learn, Kaggle)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn kaggle

    # 4. Download Dataset dari Kaggle (Opsional: Jika file CSV mentah belum ada di repo)
    # Langkah ini meniru logika di Notebook Anda.
    # Anda perlu mengatur Secrets di GitHub (KAGGLE_USERNAME & KAGGLE_KEY)
    - name: Download Dataset from Kaggle
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        if [ ! -f "2020-2025.csv" ]; then
          echo "File dataset tidak ditemukan, mengunduh dari Kaggle..."
          kaggle datasets download -d codebynadiia/gdp-per-country-20202025
          unzip -o gdp-per-country-20202025.zip
        else
          echo "File dataset sudah ada."
        fi

    # 5. Jalankan script preprocessing yang telah dibuat sebelumnya
    # Pastikan file python Anda bernama 'process_data.py' dan ada di root repo
    - name: Run Preprocessing Script
      run: python process_data.py

    # 6. Commit dan Push file CSV hasil cleaning kembali ke repo
    - name: Commit and Push Clean Data
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # Cek apakah ada perubahan pada file output
        if [[ -n $(git status --porcelain data_gdp_asean_clean.csv) ]]; then
          git add data_gdp_asean_clean.csv
          git commit -m "Auto-update: Cleaned GDP Data via GitHub Actions"
          git push
          echo "Data berhasil diupdate."
        else
          echo "Tidak ada perubahan pada data."
        fi
